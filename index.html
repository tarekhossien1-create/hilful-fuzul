<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>হিলফুল ফুযুল যুব সংঘ</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-emerald-50 to-teal-100 text-gray-800 min-h-screen pb-24">

    <!-- Header -->
    <header class="bg-emerald-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-white text-emerald-600 p-2 rounded-full font-bold shadow">
                    <i class="fa-solid fa-hands-holding-child text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">হিলফুল ফুযুল যুব সংঘ</h1>
                    <p class="text-xs text-emerald-100">নারায়ণগছ, তেঁতুলিয়া, পঞ্চগড়</p>
                </div>
            </div>
            <button onclick="openLoginModal()" class="bg-white text-emerald-600 px-3 py-1.5 rounded-full text-sm font-semibold shadow hover:bg-emerald-50 transition">
                <i class="fa-solid fa-right-to-bracket mr-1"></i> লগইন
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto p-4 space-y-6">

        <!-- Summary Cards -->
        <section class="grid grid-cols-2 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-md border border-emerald-100 flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-500 font-medium">মোট চাঁদা / ফান্ড</p>
                    <h2 class="text-xl font-bold text-emerald-600 mt-1">৳ ০</h2>
                </div>
                <div class="bg-emerald-100 text-emerald-600 p-3 rounded-full">
                    <i class="fa-solid fa-wallet text-xl"></i>
                </div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-md border border-rose-100 flex items-center justify-between">
                <div>
                    <p class="text-xs text-gray-500 font-medium">বর্তমান ব্যালেন্স</p>
                    <h2 class="text-xl font-bold text-rose-600 mt-1">৳ ০</h2>
                </div>
                <div class="bg-rose-100 text-rose-600 p-3 rounded-full">
                    <i class="fa-solid fa-piggy-bank text-xl"></i>
                </div>
            </div>
        </section>

        <!-- Navigation Tabs -->
        <nav class="bg-white rounded-xl shadow-md p-2 border border-gray-200 flex justify-around text-sm font-semibold">
            <button onclick="switchTab('subscriptions')" id="tab-subscriptions" class="tab-btn px-3 py-2.5 rounded-lg text-emerald-600 bg-emerald-50 transition flex items-center gap-1.5">
                <i class="fa-solid fa-calendar-check"></i> চাঁদা
            </button>
            <button onclick="switchTab('donations')" id="tab-donations" class="tab-btn px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 transition flex items-center gap-1.5">
                <i class="fa-solid fa-hand-holding-heart"></i> দান
            </button>
            <button onclick="switchTab('expenses')" id="tab-expenses" class="tab-btn px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 transition flex items-center gap-1.5">
                <i class="fa-solid fa-file-invoice-dollar"></i> ব্যয়
            </button>
            <button onclick="switchTab('settings')" id="tab-settings" class="tab-btn px-3 py-2.5 rounded-lg text-gray-600 hover:bg-gray-100 transition flex items-center gap-1.5 admin-only hidden">
                <i class="fa-solid fa-gear"></i> সেটিংস
            </button>
        </nav>

        <!-- TAB 1: SUBSCRIPTIONS -->
        <div id="content-subscriptions" class="tab-content active space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-md border border-gray-200 space-y-3">
                <label class="block text-sm font-semibold text-gray-700">মাস নির্বাচন করুন:</label>
                <select class="w-full border border-gray-300 rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    <option>সকল মাস (সর্বমোট)</option>
                    <option>জানুয়ারি</option>
                    <option>ফেব্রুয়ারি</option>
                </select>
            </div>
            <div class="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-gray-100 text-gray-700 uppercase text-xs">
                        <tr>
                            <th class="p-3">তারিখ / নাম</th>
                            <th class="p-3">মাসের নাম / বিবরণ</th>
                            <th class="p-3 text-right">পরিমাণ</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        <tr>
                            <td class="p-3" colspan="3" class="text-center text-gray-400">কোনো তথ্য নেই</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- TAB 2: DONATIONS -->
        <div id="content-donations" class="tab-content space-y-4">
            <div class="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-gray-100 text-gray-700 uppercase text-xs">
                        <tr>
                            <th class="p-3">দাতার নাম</th>
                            <th class="p-3">বিবরণ</th>
                            <th class="p-3 text-right">পরিমাণ</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        <tr>
                            <td class="p-3" colspan="3" class="text-center text-gray-400">কোনো তথ্য নেই</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- TAB 3: EXPENSES -->
        <div id="content-expenses" class="tab-content space-y-4">
            <div class="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-gray-100 text-gray-700 uppercase text-xs">
                        <tr>
                            <th class="p-3">তারিখ</th>
                            <th class="p-3">খাতের নাম / বিবরণ</th>
                            <th class="p-3 text-right">পরিমাণ</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-200">
                        <tr>
                            <td class="p-3" colspan="3" class="text-center text-gray-400">কোনো তথ্য নেই</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- TAB 4: SETTINGS & DATA MANAGEMENT (Admin Only) -->
        <div id="content-settings" class="tab-content space-y-4 admin-only hidden">
            <div class="bg-white p-4 rounded-xl shadow-md border border-gray-200 space-y-4">
                <h3 class="font-bold text-gray-700 border-b pb-2">নতুন ডাটা যোগ করুন</h3>
                <button onclick="openAddModal()" class="w-full bg-emerald-600 text-white py-2.5 rounded-lg font-semibold shadow hover:bg-emerald-700 transition">
                    <i class="fa-solid fa-plus mr-1"></i> ডাটা এন্ট্রি ফর্ম
                </button>
            </div>
        </div>

    </main>

    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-lg text-gray-800">অ্যাডমিন লগইন</h3>
                <button onclick="closeLoginModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="space-y-3">
                <label class="block text-sm font-medium text-gray-700">পিন কোড</label>
                <input type="password" id="adminPin" placeholder="পিন দিন" class="w-full border rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div class="flex space-x-3 pt-2">
                <button onclick="closeLoginModal()" class="flex-1 bg-gray-100 text-gray-700 py-2.5 rounded-lg font-semibold">বাতিল</button>
                <button onclick="handleLogin()" class="flex-1 bg-emerald-600 text-white py-2.5 rounded-lg font-semibold">লগইন</button>
            </div>
        </div>
    </div>

    <!-- JavaScript for Interactivity -->
    <script>
        function switchTab(tabId) {
            // Hide all tab contents
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            // Remove active style from all buttons
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('text-emerald-600', 'bg-emerald-50');
                btn.classList.add('text-gray-600', 'hover:bg-gray-100');
            });
            // Show target tab content
            document.getElementById('content-' + tabId).classList.add('active');
            
            // Highlight active button
            const activeBtn = document.getElementById('tab-' + tabId);
            activeBtn.classList.remove('text-gray-600', 'hover:bg-gray-100');
            activeBtn.classList.add('text-emerald-600', 'bg-emerald-50');
        }

        function openLoginModal() {
            document.getElementById('loginModal').classList.remove('hidden');
            document.getElementById('loginModal').classList.add('flex');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('flex');
            document.getElementById('loginModal').classList.add('hidden');
        }

        function handleLogin() {
            const pin = document.getElementById('adminPin').value;
            // এখানে আপনার পিন চেক করার কোড থাকবে, আপাতত সাধারণ উদাহরণ হিসেবে '1234' ধরা হলো
            if (pin === '1234') {
                alert('সফলভাবে লগইন হয়েছে!');
                document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
                closeLoginModal();
            } else {
                alert('ভুল পিন কোড!');
            }
        }
    </script>
</body>
</html>
