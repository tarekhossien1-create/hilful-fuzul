<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>হিলফুল ফুজুল যুব সংঘ, নারায়ণগছ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-4 min-h-screen">

  <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md p-6">
    <!-- Header -->
    <div class="flex justify-between items-center border-b pb-4 mb-4">
      <h1 class="text-xl font-bold text-emerald-700">হিলফুল ফুজুল যুব সংঘ</h1>
      <button id="loginBtn" onclick="toggleAuth()" class="bg-blue-600 text-white px-3 py-1 rounded text-sm hover:bg-blue-700">
        এডমিন লগইন
      </button>
    </div>

    <!-- Overview Cards -->
    <div class="grid grid-cols-3 gap-3 text-center mb-6">
      <div class="bg-green-50 p-3 rounded-lg border border-green-200">
        <p class="text-xs text-gray-600">মোট জমা</p>
        <p id="totalIncome" class="text-lg font-bold text-green-600">৳ 0</p>
      </div>
      <div class="bg-red-50 p-3 rounded-lg border border-red-200">
        <p class="text-xs text-gray-600">মোট ব্যয়</p>
        <p id="totalExpense" class="text-lg font-bold text-red-600">৳ 0</p>
      </div>
      <div class="bg-blue-50 p-3 rounded-lg border border-blue-200">
        <p class="text-xs text-gray-600">বর্তমান ব্যালেন্স</p>
        <p id="netBalance" class="text-lg font-bold text-blue-600">৳ 0</p>
      </div>
    </div>

    <!-- Admin Input Form -->
    <div id="adminSection" class="hidden bg-gray-50 p-4 rounded-lg border mb-6">
      <h2 class="font-bold text-gray-700 mb-2">নতুন লেনদেন যোগ করুন</h2>
      <div class="space-y-3">
        <input type="text" id="desc" placeholder="বিবরণ (যেমন: চাঁদা বা লাইট ক্রয়)" class="w-full p-2 border rounded text-sm">
        <input type="number" id="amount" placeholder="পরিমাণ (টাকা)" class="w-full p-2 border rounded text-sm">
        <select id="type" class="w-full p-2 border rounded text-sm">
          <option value="income">জমা (আয়)</option>
          <option value="expense">ব্যয় (খরচ)</option>
        </select>
        <button onclick="addTransaction()" class="w-full bg-emerald-600 text-white py-2 rounded font-semibold hover:bg-emerald-700">
          হিসাব যুক্ত করুন
        </button>
      </div>
    </div>

    <!-- Transactions List -->
    <div>
      <h2 class="font-bold text-gray-800 mb-3">লেনদেনের ইতিহাস</h2>
      <ul id="transactionList" class="space-y-2">
        <li class="text-center text-gray-400 py-4">ডেটা লোড হচ্ছে...</li>
      </ul>
    </div>
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // আপনার Firebase কনফিগারেশন
    const firebaseConfig = {
      apiKey: "AIzaSyCShgbB89pXztyVLe5a9M0rGGbpTtf_0ss",
      authDomain: "hilful-fuzul-bc9bb.firebaseapp.com",
      projectId: "hilful-fuzul-bc9bb",
      storageBucket: "hilful-fuzul-bc9bb.firebasestorage.app",
      messagingSenderId: "329333550282",
      appId: "1:329333550282:web:38e40a18bdb7ffa3ccd833",
      databaseURL: "https://hilful-fuzul-bc9bb-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    let isAdmin = false;

    // এডমিন লগইন ম্যানেজমেন্ট
    window.toggleAuth = function() {
      if(!isAdmin) {
        let pin = prompt("এডমিন পিন দিন:");
        if(pin === "1234") {
          isAdmin = true;
          document.getElementById('adminSection').classList.remove('hidden');
          document.getElementById('loginBtn').innerText = "লগআউট";
          renderData(window.currentData || {});
        } else if(pin) {
          alert("ভুল পিন কোড!");
        }
      } else {
        isAdmin = false;
        document.getElementById('adminSection').classList.add('hidden');
        document.getElementById('loginBtn').innerText = "এডমিন লগইন";
        renderData(window.currentData || {});
      }
    };

    // লেনদেন যোগ করা
    window.addTransaction = function() {
      const desc = document.getElementById('desc').value.trim();
      const amount = parseFloat(document.getElementById('amount').value);
      const type = document.getElementById('type').value;

      if(!desc || isNaN(amount) || amount <= 0) {
        alert("সঠিক তথ্য দিন!");
        return;
      }

      push(ref(db, 'transactions'), {
        desc: desc,
        amount: amount,
        type: type,
        date: new Date().toLocaleDateString('bn-BD')
      }).then(() => {
        document.getElementById('desc').value = '';
        document.getElementById('amount').value = '';
      });
    };

    // লেনদেন ডিলিট করা
    window.deleteItem = function(key) {
      if(confirm("আপনি কি এটি মুছে ফেলতে চান?")) {
        remove(ref(db, 'transactions/' + key));
      }
    };

    // রিয়েলটাইম ডেটা রিড ও আপডেট
    onValue(ref(db, 'transactions'), (snapshot) => {
      const data = snapshot.val() || {};
      window.currentData = data;
      renderData(data);
    });

    function renderData(data) {
      const list = document.getElementById('transactionList');
      list.innerHTML = '';

      let income = 0;
      let expense = 0;
      const keys = Object.keys(data);

      if(keys.length === 0) {
        list.innerHTML = '<li class="text-center text-gray-400 py-4">কোনো লেনদেন পাওয়া যায়নি</li>';
      }

      keys.reverse().forEach(key => {
        const item = data[key];
        if(item.type === 'income') income += item.amount;
        if(item.type === 'expense') expense += item.amount;

        const li = document.createElement('li');
        li.className = `flex justify-between items-center p-3 rounded-lg border ${item.type === 'income' ? 'bg-green-50 border-green-100' : 'bg-red-50 border-red-100'}`;
        
        li.innerHTML = `
          <div>
            <p class="font-semibold text-gray-800">${item.desc}</p>
            <p class="text-xs text-gray-500">${item.date}</p>
          </div>
          <div class="flex items-center space-x-3">
            <span class="font-bold ${item.type === 'income' ? 'text-green-600' : 'text-red-600'}">
              ${item.type === 'income' ? '+' : '-'} ৳${item.amount}
            </span>
            ${isAdmin ? `<button onclick="deleteItem('${key}')" class="text-red-500 text-xs hover:underline">ডিলিট</button>` : ''}
          </div>
        `;
        list.appendChild(li);
      });

      document.getElementById('totalIncome').innerText = '৳ ' + income;
      document.getElementById('totalExpense').innerText = '৳ ' + expense;
      document.getElementById('netBalance').innerText = '৳ ' + (income - expense);
    }
  </script>
</body>
</html>
